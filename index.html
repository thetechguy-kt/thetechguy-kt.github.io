---
layout: default
---
<section class="post-list">
  {% for post in site.posts %}
    <article class="post-card">
      <a href="{{ post.url | relative_url }}" class="card-link">
        <div class="card-meta">
          <time>{{ post.date | date: "%b %d, %Y" }}</time>
          {% if post.tags %}
            <span class="card-tag">{{ post.tags | first }}</span>
          {% endif %}
        </div>
        <h2>{{ post.title }}</h2>
        <p>{{ post.excerpt | strip_html | truncatewords: 28 }}</p>
      </a>
    </article>
  {% endfor %}
</section>
