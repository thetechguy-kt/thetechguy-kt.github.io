---
layout: default
---
<article class="post">
  <header class="post-header">
    <a href="{{ '/' | relative_url }}" class="back-link">← Back to all posts</a>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.tags %}
        <span class="dot">•</span>
        <div class="tags">
          {% for tag in page.tags %}
            <span class="tag">#{{ tag }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
